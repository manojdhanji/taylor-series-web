events {}

http {
    include       mime.types;
    default_type  text/html;

    # Correct place for MIME overrides
    types {
        application/javascript js;
    }

    server {
        listen 80;
        server_name localhost;

        root /usr/share/nginx/html;

        location / {
            try_files $uri $uri/ =404;
        }
    }
}
